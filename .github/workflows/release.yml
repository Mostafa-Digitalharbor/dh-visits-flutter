# Tag-only. `on: push` to a branch would queue a store build for every commit,
# and store review takes hours to days -- that queue never drains.
#
#   git tag v1.0.3 && git push origin v1.0.3   <- ships to Play + TestFlight
#
# The tag is the version. Nothing here reads the version from pubspec.yaml.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.0.3)'
        required: true
      dry_run:
        # Defaults to TRUE so a mis-click cannot ship. A tag always uploads and
        # ignores this input entirely -- there is exactly one way to reach a
        # store, and it is deliberate.
        #
        # This exists for the case a tag cannot serve: proving the credentials
        # and BOTH platform builds work end to end, including signing, without
        # burning a Play versionCode and a TestFlight build number that can
        # never be reused. Use it for the first run after a credential change,
        # not as a habit.
        description: 'Build both platforms but upload to NO store'
        type: boolean
        default: true

concurrency:
  # Never let two releases upload at once -- Play rejects an out-of-order
  # versionCode and the error is unhelpful.
  group: release
  cancel-in-progress: false

env:
  # Pinned, not `stable`. The native iOS code here is the classic
  # UIApplicationDelegate embedding (verified: no SceneDelegate.swift, no
  # UIApplicationSceneManifest, no FlutterImplicitEngineDelegate), and
  # pubspec.lock was resolved against this exact SDK. Floating on `stable`
  # means a Flutter release can turn a store build red without a single commit.
  FLUTTER_VERSION: '3.35.3'
  # Floor for the build number, so it can never collide with the 6 builds
  # already uploaded from pubspec.yaml (version: 1.0.2+6). github.run_number
  # only ever increases, so OFFSET + run_number is monotonic by construction --
  # no "read the last versionCode back from Play" step that can race or go
  # stale. Raise it (never lower it) if the workflow is ever reset.
  BUILD_NUMBER_OFFSET: '100'

jobs:
  verify:
    name: Analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test --reporter expanded

  version:
    name: Resolve version + available platforms
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      build_name: ${{ steps.v.outputs.build_name }}
      build_number: ${{ steps.v.outputs.build_number }}
      upload: ${{ steps.v.outputs.upload }}
      has_android: ${{ steps.keys.outputs.has_android }}
      has_ios: ${{ steps.keys.outputs.has_ios }}
    steps:
      - name: Derive version numbers
        id: v
        # The dispatch input goes through `env:` rather than being interpolated
        # straight into the script -- a `${{ }}` substitution is textual, so a
        # value containing shell metacharacters would be executed.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            name="${INPUT_VERSION#v}"
            # A tag always uploads; only a manual run can be a rehearsal, and
            # it has to say so explicitly (the input defaults to true).
            if [ "$INPUT_DRY_RUN" = "false" ]; then upload=true; else upload=false; fi
          else
            name="${GITHUB_REF_NAME#v}"
            upload=true
          fi
          if ! printf '%s' "$name" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$name' is not X.Y.Z. Tag as e.g. v1.0.3."
            exit 1
          fi
          number=$(( ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }} ))
          echo "build_name=$name"     >> "$GITHUB_OUTPUT"
          echo "build_number=$number" >> "$GITHUB_OUTPUT"
          echo "upload=$upload"       >> "$GITHUB_OUTPUT"

          echo "### Release $name (build $number)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$upload" = "true" ]; then
            echo "**Uploading to Play internal + TestFlight.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**DRY RUN** — both platforms build and sign, nothing is uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decide which platforms have credentials
        id: keys
        # `secrets` is NOT available in `jobs.<id>.if`, so the decision has to
        # be made inside a step and handed on as a job output. A platform whose
        # keys are missing must SKIP, not fail -- otherwise finishing the setup
        # for one store blocks shipping to the other.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          android=false
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            android=true
          fi
          ios=false
          if [ -n "$IOS_DIST_CERT_P12_BASE64" ] && [ -n "$IOS_DIST_CERT_PASSWORD" ] \
             && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8_BASE64" ]; then
            ios=true
          fi
          # Shape checks, not just presence. Two of these secrets are short
          # identifiers sitting next to a secret whose value is a huge base64
          # blob, and the blob is what happens to be on the clipboard right
          # after `base64 -w0 AuthKey_XXXX.p8 | clip`. Pasting it into
          # ASC_KEY_ID instead produced `File name too long` from a step that
          # was merely trying to name a file -- eight minutes into a macOS job,
          # with the value masked as *** so the log gave no hint.
          #
          # A missing secret means "this platform is not configured" and skips.
          # A malformed one means somebody made a mistake, so it fails loudly.
          if [ "$ios" = "true" ]; then
            if ! printf '%s' "$ASC_KEY_ID" | grep -qE '^[A-Za-z0-9]{8,12}$'; then
              echo "::error::ASC_KEY_ID must be the ~10-character App Store Connect key id (e.g. 2G7RZ7Y856), but it is ${#ASC_KEY_ID} characters. The base64 of the .p8 belongs in ASC_KEY_P8_BASE64, not here."
              exit 1
            fi
            if ! printf '%s' "$ASC_ISSUER_ID" | grep -qE '^[0-9a-fA-F-]{30,40}$'; then
              echo "::error::ASC_ISSUER_ID must be the UUID shown above the key table in App Store Connect (8-4-4-4-12 hex), but it is ${#ASC_ISSUER_ID} characters."
              exit 1
            fi
            if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
              echo "::error::ASC_KEY_P8_BASE64 holds the raw .p8 text, not its base64. Re-run: base64 -w0 AuthKey_<id>.p8"
              exit 1
            fi
            echo "iOS secret shapes OK (key id ${#ASC_KEY_ID} chars, issuer ${#ASC_ISSUER_ID} chars)."
          fi

          echo "has_android=$android" >> "$GITHUB_OUTPUT"
          echo "has_ios=$ios"         >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "| platform | credentials present |"
            echo "|---|---|"
            echo "| Android / Play | $android |"
            echo "| iOS / TestFlight | $ios |"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: AAB to Play (internal)
    needs: version
    if: needs.version.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk space
        # A Flutter release AAB needs more than the ~14 GB left after Gradle
        # unpacks the NDK and CMake. Running out surfaces as
        #   Could not add entry '.../transforms/...' to cache file-access.bin
        # which reads like a corrupted cache, not a full disk. These four
        # toolchains are the biggest things on the image we will never use.
        # Kept identical to ci.yml. That lane hit the wall first -- a debug APK
        # keeps the x86 ABIs a release AAB splits out -- but the release job
        # runs on the same image and installs the same NDK, SDK platform and
        # CMake mid-build, so it has no more headroom to spare.
        run: |
          echo "--- before ---"; df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "--- after ---";  df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cap Gradle memory for the runner
        # android/gradle.properties asks for -Xmx8G -XX:MaxMetaspaceSize=4G,
        # which is right on a dev box and fatal on a 2 vCPU / 7 GB runner: the
        # JVM gets OOM-killed, Gradle exits 143, and GitHub prints
        # "The operation was canceled" -- which looks like somebody pressed
        # cancel, not like a memory failure.
        #
        # A gradle.properties in GRADLE_USER_HOME overrides the project's, so
        # the project file stays untouched and local builds stay fast.
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m' \
            'org.gradle.daemon=false' \
            'org.gradle.parallel=false' \
            'org.gradle.workers.max=2' \
            'kotlin.daemon.jvmargs=-Xmx1G' \
            > "$HOME/.gradle/gradle.properties"
          echo "--- effective GRADLE_USER_HOME properties ---"
          cat "$HOME/.gradle/gradle.properties"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          # android/app/build.gradle.kts reads android/key.properties and falls
          # back to DEBUG signing when it is absent. A debug-signed AAB uploads
          # and is then rejected by Play for the wrong certificate, so fail here
          # where the cause is obvious instead.
          test -s "$RUNNER_TEMP/upload-keystore.jks" \
            || { echo "::error::Decoded keystore is empty -- ANDROID_KEYSTORE_BASE64 is malformed."; exit 1; }
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
          } > android/key.properties
          echo "android/key.properties written (values masked)."

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Build the signed AAB
        # --no-tree-shake-icons is REQUIRED, not hygiene. The app draws its
        # icons from material_symbols_icons, which ships VARIABLE fonts, and
        # the release icon tree-shaker drops glyphs from those -- producing a
        # store build where whole rows of icons render blank.
        # See docs/ICONS_TREE_SHAKING.md.
        #
        # The defines are assembled here rather than in a separate step so the
        # values never pass through a step output.
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ODOO_DATABASE: ${{ secrets.ODOO_DATABASE }}
          # Optional override only -- a release build already reports to the
          # project DSN baked into AppEnvironment._releaseDsn. Set this secret
          # only to point a build at a DIFFERENT Sentry project.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_PERCENT: ${{ vars.SENTRY_TRACES_PERCENT }}
          # Company-controlled OSRM for road-matched route display. Unset =
          # routes drawn as recorded GPS. See docs/MAP_MATCHING_DEPLOYMENT.md.
          MAP_MATCHING_URL: ${{ vars.MAP_MATCHING_URL }}
          MAP_MATCHING_MAX_POINTS: ${{ vars.MAP_MATCHING_MAX_POINTS }}
        run: |
          set -euo pipefail
          # Employee coordinates never go to a public demo router from a store
          # build. AppEnvironment refuses it too; failing here says why.
          case "${MAP_MATCHING_URL:-}" in
            *project-osrm.org*|*routing.openstreetmap.de*)
              echo "::error::MAP_MATCHING_URL points at a public OSRM demo server. Use the company-controlled server."
              exit 1 ;;
          esac
          # `--dart-define=K=` with an EMPTY value is NOT the same as omitting
          # it. String.fromEnvironment falls back to its defaultValue only when
          # the key is ABSENT; an empty string is a value and wins. Passing an
          # unset secret through blindly would blank APP_FLAVOR (default 'dev')
          # and blank SENTRY_DSN -- which is what shipped a store release with
          # crash reporting switched off. AppEnvironment now carries the DSN
          # itself so that one can no longer happen, but the trap is general:
          # any future define added here has to go through `add`.
          #
          # Written as if/else rather than `[ -n "$X" ] && flags=...`: under
          # `set -e` a false test on the LAST line of the script exits 1 and
          # fails the step, which makes the whole thing depend on line order.
          flags="--dart-define=APP_FLAVOR=production"
          add() {
            if [ -n "$2" ]; then
              flags="$flags --dart-define=$1=$2"
              echo "  $1 = <set>"
            else
              echo "  $1 = <omitted, code default applies>"
            fi
          }
          echo "dart-defines:"
          echo "  APP_FLAVOR = production"
          add API_BASE_URL          "${API_BASE_URL:-}"
          add ODOO_DATABASE         "${ODOO_DATABASE:-}"
          add SENTRY_DSN            "${SENTRY_DSN:-}"
          add SENTRY_TRACES_PERCENT "${SENTRY_TRACES_PERCENT:-}"
          add MAP_MATCHING_URL        "${MAP_MATCHING_URL:-}"
          add MAP_MATCHING_MAX_POINTS "${MAP_MATCHING_MAX_POINTS:-}"

          flutter build appbundle --release --no-tree-shake-icons \
            --build-name=${{ needs.version.outputs.build_name }} \
            --build-number=${{ needs.version.outputs.build_number }} \
            $flags

      - name: Confirm the AAB is signed with the upload key
        # Catches the failure this lane cannot otherwise see: a key.properties
        # that exists but names the wrong alias still yields a valid-looking
        # AAB, and Play only rejects it after the upload.
        #
        # Do NOT use `jarsigner -verify` here. It is a JAR utility that predates
        # the APK Signature Schemes, so on a perfectly valid AAB it reports
        # every single entry as
        #   "Entry base/... is signed in JarFile but is not signed in
        #    JarInputStream"
        # and exits non-zero -- hundreds of lines of noise that read like a
        # broken signature and fail the release on a good build.
        #
        # Compare the certificates instead. That is the thing Play actually
        # checks, and it is one line of output either way.
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          ls -la "$aab"

          # Capture each tool's whole output first and slice it in memory --
          # piping a JVM straight into `grep -m1` can kill it on EPIPE and, with
          # pipefail on, fail the step for a reason that is not the signature.
          from_keystore="$(keytool -list -v \
            -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null || true)"
          from_aab="$(keytool -printcert -jarfile "$aab" 2>/dev/null || true)"
          if ! printf '%s\n' "$from_aab" | grep -q 'SHA256:'; then
            # `-jarfile` reads the v1 (JAR) signature block. An AAB always has
            # one -- Play re-signs the APKs it derives -- but reach into the
            # archive directly rather than trusting that, because the failure
            # mode is a green build reported as unsigned.
            from_aab="$(unzip -p "$aab" 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 2>/dev/null \
              | keytool -printcert 2>/dev/null || true)"
          fi

          expected="$(printf '%s\n' "$from_keystore" | grep 'SHA256:' | head -n 1 | tr -d ' \t')"
          actual="$(printf '%s\n' "$from_aab"        | grep 'SHA256:' | head -n 1 | tr -d ' \t')"

          echo "keystore : $expected"
          echo "aab      : $actual"

          if [ -z "$actual" ]; then
            echo "::error::The AAB carries no signature at all."
            exit 1
          fi
          if printf '%s\n' "$from_aab" | grep -qi 'CN=Android Debug'; then
            echo "::error::The AAB is DEBUG-signed -- android/key.properties did not take effect."
            exit 1
          fi
          if [ "$expected" != "$actual" ]; then
            echo "::error::The AAB was signed with a different certificate than the keystore in ANDROID_KEYSTORE_BASE64. Play would reject it."
            exit 1
          fi
          echo "Signature matches the upload key."

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Skipping the Play upload (dry run)
        if: needs.version.outputs.upload != 'true'
        run: |
          echo "::notice::DRY RUN -- the AAB was built and signature-verified but NOT uploaded."
          echo "The signed AAB is attached to this run as the \`app-release-aab\` artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to the Play internal track
        if: needs.version.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.digitalharbor.visits
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # internal, never production. Promoting to production stays a
          # deliberate click in the Play Console, not a side effect of a tag.
          track: internal
          status: completed
          # Native crash symbolication in the Play Console. The task name is
          # part of the path under AGP 8.x -- `.../release/out/lib` (the layout
          # every blog post still shows) does not exist here. Verified against
          # a real local release build:
          #   build/app/intermediates/merged_native_libs/release/
          #     mergeReleaseNativeLibs/out/lib/{arm64-v8a,armeabi-v7a,x86,x86_64}
          debugSymbols: build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib

  ios:
    name: IPA to TestFlight (internal)
    needs: version
    if: needs.version.outputs.has_ios == 'true'
    # macos-15 on purpose. Since April 2025 the App Store rejects anything not
    # built against the iOS 18 SDK, which needs Xcode 16+; macos-13 only
    # carries Xcode 15, which additionally cannot parse a project that uses
    # PBXFileSystemSynchronizedRootGroup (it dies with a DVTAssertions failure
    # and signal 6).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        # sort -V, not a glob. A pattern like Xcode_1[6-9]* looks right and
        # matches NOTHING today, because Apple jumped from 16.x straight to
        # 26.x -- so the glob silently leaves the runner on its default Xcode.
        run: |
          set -euo pipefail
          latest="$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Installed: $(printf '%s ' /Applications/Xcode*.app)"
          echo "Selecting: $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          # Capture the whole output into a variable and inspect it in memory.
          # Piping `xcodebuild -version` into `head` makes xcodebuild 26 die on
          # EPIPE (Broken pipe, exit 134) AFTER it has already printed the
          # correct version -- and with pipefail on, the step fails looking
          # like a bad Xcode selection.
          xcver="$(xcodebuild -version)"
          echo "$xcver"
          printf '%s' "$xcver" | grep -q '^Xcode ' \
            || { echo "::error::xcodebuild did not report a version"; exit 1; }

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          # bundler-cache is deliberately OFF. It needs a Gemfile.lock (not
          # committed -- generating one on Windows pins the wrong platforms)
          # and it sets BUNDLE_PATH=vendor/bundle, which moves the `pod`
          # binstub off PATH. `flutter build ios` shells out to `pod` directly
          # rather than through bundler, so that alone breaks the build.
          bundler-cache: false

      - name: Install fastlane + CocoaPods
        working-directory: ios
        run: |
          gem install bundler --no-document
          bundle install --jobs 4

      - name: Verify CocoaPods is on PATH in this Ruby
        # Ten seconds here instead of a 20-minute build that ends in
        # "CocoaPods is installed but broken" followed by a link failure,
        # because ruby/setup-ruby installed a Ruby that is not the one the
        # image pre-installed CocoaPods into.
        run: |
          set -euo pipefail
          which pod
          pod --version
          echo "ruby: $(which ruby) -- $(ruby -v)"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Import the Apple distribution certificate
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/build.keychain-db"
          kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 7200 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          # Prepend rather than replace: the login keychain must stay
          # searchable or codesign cannot find Apple's intermediate CAs.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" \
            -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          # Without this, codesign raises a GUI keychain-access prompt that
          # nobody can click and the step hangs until the job timeout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" >/dev/null
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "--- identities available for signing ---"
          identities="$(security find-identity -v -p codesigning "$kc")"
          echo "$identities"

          # Assert a DISTRIBUTION certificate actually landed in the keychain.
          # A Development certificate imports just as happily and only reveals
          # itself much later, during export, as a profile error.
          #
          # This is a check, NOT a value to pass on. Handing the identity to
          # xcodebuild as `CODE_SIGN_IDENTITY=...` looks like the obvious fix
          # for the stock `"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone
          # Developer"` in project.pbxproj, and it fails every target at once:
          #
          #   PromisesObjC has conflicting provisioning settings.
          #   PromisesObjC is automatically signed, but code signing identity
          #   Apple Distribution: ... has been manually specified.
          #
          # A command-line build setting applies to EVERY target, pods
          # included, and naming an identity is what Xcode calls manual
          # signing -- which contradicts CODE_SIGN_STYLE=Automatic. Automatic
          # signing already resolves the right identity from the profile it
          # mints, so the project's stale value is overridden anyway. Leave it
          # alone; the certificate just has to be present.
          #
          # The name differs by certificate age: "Apple Distribution: ..." on
          # anything issued recently, "iPhone Distribution: ..." on older ones.
          signing_identity="$(printf '%s\n' "$identities" \
            | sed -nE 's/.*"((Apple|iPhone) Distribution:[^"]*)".*/\1/p' \
            | head -n 1)"
          if [ -z "$signing_identity" ]; then
            echo "::error::No Apple/iPhone Distribution identity in the imported .p12. A Development certificate cannot sign an App Store build."
            exit 1
          fi
          echo "Distribution identity present: $signing_identity"

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          key="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # Normalise while decoding. A .p8 downloaded and then saved on
          # Windows can carry CRLF line endings and no trailing newline, and
          # OpenSSL refuses to parse it -- the error talks about PEM structure,
          # never about carriage returns. `sed` fixes both in one pass and is a
          # no-op on a clean key.
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -D | tr -d '\r' > "$key"
          [ -s "$key" ] && [ "$(tail -c 1 "$key" | wc -l)" -eq 1 ] || printf '\n' >> "$key"

          grep -q "BEGIN PRIVATE KEY" "$key" \
            || { echo "::error::ASC_KEY_P8_BASE64 did not decode to a .p8 private key."; exit 1; }
          # Prove it actually parses, here, rather than 20 minutes later inside
          # xcodebuild's cloud-signing call where the message is unhelpful.
          openssl pkey -in "$key" -noout \
            || { echo "::error::The decoded .p8 is not a readable private key."; exit 1; }
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Verify the App Store Connect credentials
        working-directory: ios
        # One real API call, before the ~20 minutes of Flutter compile and
        # xcodebuild archive. It settles all three ways these secrets go wrong
        # at once: ASC_KEY_ID paired with a different key's .p8, an ASC_ISSUER_ID
        # from another organisation, and a key whose role is App Manager rather
        # than Admin. Each of those otherwise fails late, with a message that
        # points somewhere else entirely.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: bundle exec fastlane check_credentials

      - name: Build the Flutter side (unsigned)
        # Two steps on purpose. This one runs the Dart compile and writes the
        # dart-defines into ios/Flutter/Generated.xcconfig, which the xcodebuild
        # archive below then reads -- that is how the defines reach the archive
        # at all. It also means a Dart error fails here, plainly, instead of
        # somewhere inside an xcodebuild log.
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ODOO_DATABASE: ${{ secrets.ODOO_DATABASE }}
          # Optional override only -- a release build already reports to the
          # project DSN baked into AppEnvironment._releaseDsn. Set this secret
          # only to point a build at a DIFFERENT Sentry project.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_PERCENT: ${{ vars.SENTRY_TRACES_PERCENT }}
          MAP_MATCHING_URL: ${{ vars.MAP_MATCHING_URL }}
          MAP_MATCHING_MAX_POINTS: ${{ vars.MAP_MATCHING_MAX_POINTS }}
        run: |
          set -euo pipefail
          case "${MAP_MATCHING_URL:-}" in
            *project-osrm.org*|*routing.openstreetmap.de*)
              echo "::error::MAP_MATCHING_URL points at a public OSRM demo server. Use the company-controlled server."
              exit 1 ;;
          esac
          # Same empty-value trap as the Android job -- an empty
          # `--dart-define=SENTRY_DSN=` beats the code's default and ships a
          # release with crash reporting off. See the comment there.
          flags="--dart-define=APP_FLAVOR=production"
          add() {
            if [ -n "$2" ]; then
              flags="$flags --dart-define=$1=$2"
              echo "  $1 = <set>"
            else
              echo "  $1 = <omitted, code default applies>"
            fi
          }
          echo "dart-defines:"
          echo "  APP_FLAVOR = production"
          add API_BASE_URL          "${API_BASE_URL:-}"
          add ODOO_DATABASE         "${ODOO_DATABASE:-}"
          add SENTRY_DSN            "${SENTRY_DSN:-}"
          add SENTRY_TRACES_PERCENT "${SENTRY_TRACES_PERCENT:-}"
          add MAP_MATCHING_URL        "${MAP_MATCHING_URL:-}"
          add MAP_MATCHING_MAX_POINTS "${MAP_MATCHING_MAX_POINTS:-}"

          flutter build ios --release --no-codesign --no-tree-shake-icons \
            --build-name=${{ needs.version.outputs.build_name }} \
            --build-number=${{ needs.version.outputs.build_number }} \
            $flags

      - name: Archive
        working-directory: ios
        # -allowProvisioningUpdates together with the API key is what lets
        # Apple mint the App Store profile for net.digitalharbor.visits on a
        # runner that has never seen this app -- so no .mobileprovision has to
        # live in the repo or in a secret.
        #
        # The key must have the ADMIN role. App Manager can upload a build but
        # cannot cloud-sign, and it fails during export as "Cloud signing
        # permission error / No profiles were found" -- which reads like a
        # provisioning problem rather than a permissions one.
        #
        # DEVELOPMENT_TEAM is passed on the command line because the checked-in
        # project has none at all (verified: no DEVELOPMENT_TEAM anywhere in
        # project.pbxproj).
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM=P95FNYY2S2 \
            CODE_SIGN_STYLE=Automatic

      - name: Guard the purpose strings before exporting
        # Apple runs a static check for protected-resource APIs and rejects the
        # upload if any referenced one lacks a purpose string:
        #
        #   90683: Missing purpose string in Info.plist ... should contain a
        #   NSPhotoLibraryUsageDescription key ... While your app might not use
        #   these APIs, a purpose string is still required.
        #
        # That verdict lands AFTER a clean archive, a clean export and a
        # two-minute upload -- roughly 25 minutes of macOS runner, billed at
        # 10x. This step costs one second.
        #
        # NSPhotoLibraryUsageDescription is on the list even though the app only
        # ever calls ImagePicker with ImageSource.camera: image_picker_ios and
        # file_picker link PHPhotoLibrary symbols regardless, and the reference
        # alone is what Apple checks.
        #
        # Add a key here whenever a new plugin pulls in a protected API. The
        # list is deliberately hand-maintained -- an automatic scan would have
        # to reimplement Apple's own analysis to be trustworthy.
        run: |
          set -euo pipefail
          plist="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app/Info.plist"
          missing=0
          # An active visit's trail is recorded in the background: the Always
          # and temporary-accuracy strings and the `location` background mode
          # have to ship together with VisitLocation.swift, or App Review
          # (and allowsBackgroundLocationUpdates) fails.
          for key in \
            NSLocationWhenInUseUsageDescription \
            NSLocationAlwaysAndWhenInUseUsageDescription \
            NSLocationTemporaryUsageDescriptionDictionary:VisitRoute \
            NSCameraUsageDescription \
            NSPhotoLibraryUsageDescription; do
            value="$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null || true)"
            if [ -z "$value" ]; then
              echo "::error::$key is missing from the built Info.plist. Apple rejects the upload with error 90683 after the whole build has run."
              missing=1
            else
              echo "  $key = $value"
            fi
          done
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$plist" 2>/dev/null | grep -q '^ *location$'; then
            echo "::error::UIBackgroundModes lacks 'location'; an active visit's trail would stop recording in the background."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "All purpose strings present."

      - name: Guard MinimumOSVersion before exporting
        # The archive builds, exports and uploads perfectly happily with an
        # empty MinimumOSVersion, and Apple only rejects it minutes later
        # during processing: "MinimumOSVersion in
        # 'Runner.app/Frameworks/App.framework' is ''". Checking costs a second
        # and turns a delayed, cryptic rejection into an immediate failure.
        run: |
          set -euo pipefail
          plist="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app/Frameworks/App.framework/Info.plist"
          v="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist" 2>/dev/null || true)"
          echo "App.framework MinimumOSVersion = '$v'"
          [ -n "$v" ] || { echo "::error::MinimumOSVersion is empty -- Apple will reject this upload. Check ios/Flutter/AppFrameworkInfo.plist."; exit 1; }

      - name: Export the IPA
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      - name: Skipping the TestFlight upload (dry run)
        if: needs.version.outputs.upload != 'true'
        run: |
          echo "::notice::DRY RUN -- the IPA was archived, signed and exported but NOT uploaded."
          echo "The signed IPA is attached to this run as the \`app-release-ipa\` artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to TestFlight
        if: needs.version.outputs.upload == 'true'
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: |
          set -euo pipefail
          ipa="$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -n 1)"
          echo "Uploading $ipa"
          bundle exec fastlane beta ipa:"$ipa"

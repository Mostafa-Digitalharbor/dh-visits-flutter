# Sized for a developer machine. CI overrides this file wholesale by writing
# its own gradle.properties into GRADLE_USER_HOME (which takes precedence), so
# the 2 vCPU / 7 GB runner gets -Xmx3G while local builds stay fast.
# See .github/workflows/release.yml -> "Cap Gradle memory".
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# android.enableJetifier intentionally REMOVED (2026-08-18).
#
# Jetifier rewrites every dependency archive to swap com.android.support.* for
# androidx.*, holding each one in memory while it works. This project has zero
# legacy support-library dependencies:
#   find ~/.gradle/caches/modules-2/files-2.1 -maxdepth 1 \
#        \( -iname "com.android.support*" -o -iname "android.arch*" \) | wc -l
#   -> 0
# so it was rewriting hundreds of jars to change nothing. Under a 3 GB heap the
# debug build died with "JetifyTransform ... Java heap space" (debug bundles the
# x86/x86_64 jars too, so it tips over where release squeaks through).
# Do NOT add it back without re-running the find above and getting a non-zero.

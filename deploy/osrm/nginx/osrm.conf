# TLS front for osrm-routed. Exposes only the map-matching service the app
# uses, rate-limits it, and never writes coordinates to a log: OSRM carries
# them in the request path, so the access log format below omits the URI.

log_format osrm_private '$remote_addr [$time_local] "$request_method" $status '
                        '$body_bytes_sent $request_time';

limit_req_zone $binary_remote_addr zone=osrm_match:10m rate=5r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
    access_log off;
}

server {
    listen 443 ssl;
    http2 on;
    server_name osrm.example.com;   # replace with the real host name

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log osrm_private;
    # error lines can quote the request line (with coordinates); keep them
    # to real failures only.
    error_log  /var/log/nginx/error.log crit;

    # A 90-point match is a ~5 KB GET line.
    large_client_header_buffers 4 16k;
    server_tokens off;

    location ~ ^/match/v1/[a-z]+/ {
        limit_except GET { deny all; }
        limit_req zone=osrm_match burst=20 nodelay;
        limit_req_status 429;   # the app backs off and draws raw GPS on 429

        proxy_pass http://osrm:5000;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # Routing, table, trip, nearest, tile: not used by the app, not exposed.
    location / {
        return 404;
    }
}

name: location_gps
description: "Customer Visits — Field employee check-in/out app with live location tracking."
publish_to: 'none'
# Bump versionName (1.0.0) for user-visible releases, versionCode (+N) for every
# store upload (Play Store requires monotonically increasing versionCode).
version: 1.0.1+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Location & permissions
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Routing
  go_router: ^14.6.2

  # Dependency injection
  get_it: ^8.0.2

  # UI
  shimmer: ^3.0.0
  material_symbols_icons: ^4.2785.1   # Material Symbols Rounded — design icon set

  # Utilities
  intl: ^0.20.1
  # Direct (not just transitive) because we use p.basename to sanitise
  # server-supplied attachment filenames before writing them to temp.
  path: ^1.9.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  timezone: ^0.9.4
  google_fonts: ^6.2.1
  package_info_plus: ^8.1.1

  # Error & crash reporting
  sentry_flutter: ^8.12.0
  file_picker: ^11.0.2
  open_filex: ^4.7.0
  image_picker: ^1.1.2   # Camera capture for proof-of-visit photos

  # Push notifications (FCM). The backend (dh_visit_management) sends a push on
  # each visit workflow event; the app registers its FCM token after login and
  # deep-links to the visit from a notification tap. See
  # docs/BACKEND_PUSH_NOTIFICATIONS.md. flutter_local_notifications renders the
  # heads-up banner while the app is in the foreground.
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

# ─── Launcher icons ────────────────────────────────────────────────────────────
# Sources under assets/icon/ are build-time only and deliberately NOT listed
# under flutter.assets below — they must not ship in the app bundle.
# Regenerate them from the master artwork first, then rebuild the icons:
#   pwsh tool/generate_icons.ps1
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  # Android legacy (pre-adaptive) icon: the plate with transparent corners.
  image_path_android: "assets/images/visit-logo.png"
  # iOS forbids alpha and applies its own squircle mask, so it gets a
  # full-bleed navy variant with no rounded corners of its own.
  image_path_ios: "assets/icon/visit-logo-ios.png"
  remove_alpha_ios: true
  min_sdk_android: 23
  # The launcher masks the foreground to its own shape, so the foreground is
  # the glyph alone (no plate) over a solid navy background — otherwise the
  # artwork's rounded square would show nested inside the launcher's circle.
  adaptive_icon_background: "#091731"
  adaptive_icon_foreground: "assets/icon/visit-logo-foreground.png"
  web:
    generate: false

# ─── Native splash screen ──────────────────────────────────────────────────────
# Run after editing:  dart run flutter_native_splash:create
# Navy ground with the plate-less glyph, matching the launcher icon so the
# hand-off from system splash to the in-app splash has no colour flash.
flutter_native_splash:
  color: "#091731"
  image: assets/icon/visit-logo-foreground.png
  android_12:
    image: assets/icon/visit-logo-foreground.png
    color: "#091731"
  ios: true
  android: true
  web: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

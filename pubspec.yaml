name: location_gps
description: "Customer Visits — Field employee check-in/out app with live location tracking."
publish_to: 'none'
# Bump versionName (1.0.0) for user-visible releases, versionCode (+N) for every
# store upload (Play Store requires monotonically increasing versionCode).
version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Location & permissions
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Routing
  go_router: ^14.6.2

  # Dependency injection
  get_it: ^8.0.2

  # UI
  shimmer: ^3.0.0
  material_symbols_icons: ^4.2785.1   # Material Symbols Rounded — design icon set

  # Utilities
  intl: ^0.20.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  timezone: ^0.9.4
  google_fonts: ^6.2.1
  package_info_plus: ^8.1.1

  # Error & crash reporting
  sentry_flutter: ^8.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

# ─── Launcher icons ────────────────────────────────────────────────────────────
# Run after editing:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"
  remove_alpha_ios: true
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpg"
  web:
    generate: false

# ─── Native splash screen ──────────────────────────────────────────────────────
# Run after editing:  dart run flutter_native_splash:create
# This replaces the default white splash with the company logo on a branded
# background, on both iOS LaunchScreen and Android 12+ splash API.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.jpg
  android_12:
    image: assets/images/logo.jpg
    color: "#FFFFFF"
  ios: true
  android: true
  web: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

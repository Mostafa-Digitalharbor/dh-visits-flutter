name: location_gps
description: "Customer Visits — Field employee check-in/out app with live location tracking."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Location & permissions
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Routing
  go_router: ^14.6.2

  # Dependency injection
  get_it: ^8.0.2

  # UI
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.20.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  timezone: ^0.9.4
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpg"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
